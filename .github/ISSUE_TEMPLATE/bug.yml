name: Bug / Regression
description: Report a bug or track a v1 regression from 01-requirements.md §5
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Don't paste personal data (names, student numbers, grades, screenshots of someone's plan). Security problems go through [SECURITY.md](https://github.com/Turing-Council/dtu-compass/blob/main/SECURITY.md) instead.
  - type: input
    id: v1_bug
    attributes:
      label: v1 Regression Reference (optional)
      placeholder: "§5 #9 (Overworked % denominator)"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - web
        - pipeline
        - mcp
        - infra
        - docs
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behaviour
    validations:
      required: true
